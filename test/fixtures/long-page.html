<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Web Capture regression page</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 20px/1.5 system-ui, sans-serif; color: #102a43; }
    header { position: sticky; top: 0; z-index: 2; padding: 16px 32px; color: white; background: #102a43; }
    section { min-height: 760px; padding: 110px 10vw 80px; border-bottom: 12px solid white; }
    section:nth-of-type(1) { background: #d9f99d; }
    section:nth-of-type(2) { background: #a7f3d0; }
    section:nth-of-type(3) { background: #93c5fd; }
    section:nth-of-type(4) { background: #c4b5fd; }
    section:nth-of-type(5) { background: #f9a8d4; }
    section:nth-of-type(6) { background: #fed7aa; }
    section:nth-of-type(7) { background: #fde68a; }
    section:nth-of-type(8) { background: #bae6fd; }
    section:nth-of-type(9) { background: #bbf7d0; }
    .marker { padding: 8px 14px; border-radius: 8px; background: rgb(255 255 255 / 70%); display: inline-block; }
    img { display: block; width: min(720px, 100%); margin-top: 48px; border: 8px solid white; border-radius: 12px; }
  </style>
</head>
<body>
  <header>Regression fixture — every numbered colour section and illustration must appear once.</header>
  <main id="content"></main>
  <script>
    const content = document.querySelector('#content');
    const colours = ['#65a30d', '#059669', '#2563eb', '#7c3aed', '#db2777', '#ea580c', '#ca8a04', '#0284c7', '#16a34a'];

    for (let number = 1; number <= 9; number += 1) {
      const section = document.createElement('section');
      section.innerHTML = `<h1>Section ${number} of 9</h1><p class="marker">Coverage marker ${number}: no missing or white band is acceptable.</p>`;
      const image = document.createElement('img');
      image.alt = `Lazy illustration ${number}`;
      image.dataset.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280"><rect width="100%" height="100%" fill="${colours[number - 1]}"/><text x="50%" y="54%" text-anchor="middle" font-family="sans-serif" font-size="54" fill="white">Lazy image ${number}</text></svg>`)}`;
      section.append(image);
      content.append(section);
    }

    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting || entry.target.src) continue;
        const image = entry.target;
        setTimeout(() => {
          image.src = image.dataset.src;
        }, 250);
        observer.unobserve(image);
      }
    }, { rootMargin: '120px' });
    document.querySelectorAll('img').forEach((image) => observer.observe(image));
  </script>
</body>
</html>
